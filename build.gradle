plugins {
    id 'net.neoforged.moddev' version '2.0.49-beta'
}

group = project.group
version = project.mod_version

java.toolchain.languageVersion = JavaLanguageVersion.of(project.java_version as int)

repositories {
    mavenCentral()
    maven { url = uri('https://maven.michiyo.me/releases') }
    maven {
        name = 'kotori316'
        url = uri('https://maven.kotori316.com')
    }
}

neoForge {
    version = project.neoforge_version
    parchment {
        minecraftVersion = project.parchment_minecraft
        mappingsVersion = project.parchment_version
    }
    runs {
        configureEach {
            ideName = "OpenSockets ${name.capitalize()}"
        }
        client { client() }
        server { server() }
    }
    mods {
        "${project.mod_id}" { sourceSet sourceSets.main }
    }
}

dependencies {
    def localOcApi = providers.gradleProperty('opensockets_oc_api')
    if (localOcApi.isPresent()) {
        compileOnly files(localOcApi.get())
    } else {
        compileOnly "li.cil.oc:opencomputers:${project.opencomputers_api_version}:api"
    }

    def localOcRuntime = providers.gradleProperty('opensockets_oc_runtime')
    if (localOcRuntime.isPresent()) {
        runtimeOnly files(localOcRuntime.get())
    } else {
        runtimeOnly "li.cil.oc:opencomputers:${project.opencomputers_version}"
    }

    // OpenComputers: Rebooted uses Kotori's Scala language provider. Keep it
    // as a separate runtime dependency; OpenSockets must not bundle OC or its
    // language provider into the addon jar.
    def localScalaRuntime = providers.gradleProperty('opensockets_scala_runtime')
    if (localScalaRuntime.isPresent()) {
        runtimeOnly files(localScalaRuntime.get())
    } else {
        runtimeOnly("com.kotori316:scalablecatsforce-neoforge:${project.opencomputers_scala_version}:with-library") {
            transitive = false
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

def resourceProperties = [
        mod_id: project.mod_id,
        mod_name: project.mod_name,
        mod_author: project.mod_author,
        license: project.license,
        description: project.description,
        version: project.version.toString(),
        neoforge_loader_version_range: project.neoforge_loader_version_range,
        neoforge_version: project.neoforge_version,
        minecraft_version_range: project.minecraft_version_range
]

tasks.named('processResources') {
    inputs.properties(resourceProperties)
    filesMatching('META-INF/neoforge.mods.toml') {
        expand(resourceProperties)
    }
}
